<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biodata Mahasiswa - UNINDRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen flex flex-col items-center bg-gradient-to-br from-gray-950 via-black to-gray-900 text-gray-100 font-sans"
  >
    <header
      class="flex items-center justify-center gap-6 py-10 animate-fade-in"
    >
      <img
        class="w-28 h-28 rounded-full shadow-2xl ring-4 ring-white/10 hover:scale-110 transition-transform duration-500"
        src="./logo-unindra.png"
        alt="logo_unindra"
      />
      <div class="text-center">
        <h2 class="text-3xl font-extrabold text-white drop-shadow-lg">
          UNIVERSITAS INDRAPRASTA PGRI
        </h2>
        <h2 class="text-xl font-semibold text-gray-300">(UNINDRA)</h2>
        <h3 class="italic text-gray-400">
          Jl. Nangka No.58 Tanjung Barat - Jaksel
        </h3>
      </div>
    </header>

    <hr class="w-3/4 border-t-[3px] border-blue-400/70 my-6 animate-scale-in" />

    <div
      class="backdrop-blur-3xl bg-white/10 border border-white/20 rounded-3xl shadow-[0_8px_40px_rgba(0,0,0,0.6)] p-10 w-full max-w-2xl mt-6 relative overflow-hidden animate-slide-up before:absolute before:inset-0 before:rounded-3xl before:bg-gradient-to-r before:from-blue-500/30 before:to-purple-500/30 before:opacity-30 before:blur-2xl before:-z-10"
    >
      <h3
        class="text-2xl font-semibold text-center text-white mb-8 tracking-wide"
      >
        BIODATA MAHASISWA
      </h3>
      <form action="" class="space-y-6">
        <div class="flex items-center gap-4">
          <label class="w-40 font-medium text-gray-200">Nama</label>
          <input
            type="text"
            name="nama"
            placeholder="Masukkan Nama"
            class="flex-1 p-3 border border-white/20 rounded-xl bg-white/5 backdrop-blur-lg placeholder-gray-400 text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400/70 transition"
          />
        </div>

        <div class="flex items-start gap-4">
          <label class="w-40 font-medium text-gray-200 pt-3">Alamat</label>
          <textarea
            name="alamat"
            rows="3"
            placeholder="Masukkan Alamat"
            class="flex-1 p-3 border border-white/20 rounded-xl bg-white/5 backdrop-blur-lg placeholder-gray-400 text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400/70 transition"
          ></textarea>
        </div>

        <div class="flex items-center gap-4">
          <label class="w-40 font-medium text-gray-200">Tanggal Lahir</label>
          <input
            type="date"
            name="tanggal_lahir"
            class="flex-1 p-3 border border-white/20 rounded-xl bg-white/5 backdrop-blur-lg text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400/70 transition"
          />
        </div>

        <div class="flex items-center gap-4">
          <label class="w-40 font-medium text-gray-200">Telp</label>
          <input
            type="text"
            name="telp"
            placeholder="08xxxxxxxx"
            class="flex-1 p-3 border border-white/20 rounded-xl bg-white/5 backdrop-blur-lg placeholder-gray-400 text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400/70 transition"
          />
        </div>

        <div class="flex items-center gap-4">
          <label class="w-40 font-medium text-gray-200">Email</label>
          <input
            type="email"
            name="email"
            placeholder="email@example.com"
            class="flex-1 p-3 border border-white/20 rounded-xl bg-white/5 backdrop-blur-lg placeholder-gray-400 text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400/70 transition"
          />
        </div>

        <div class="flex justify-center gap-6 pt-6">
          <button
            type="submit"
            class="px-7 py-2 bg-gradient-to-r from-blue-500/80 to-purple-600/80 text-white rounded-xl shadow-xl hover:from-blue-500 hover:to-purple-600 hover:scale-105 active:scale-95 transition-all duration-300"
          >
            SIMPAN
          </button>
          <button
            type="reset"
            class="px-7 py-2 bg-white/10 border border-white/20 text-white rounded-xl shadow-lg hover:bg-white/20 hover:scale-105 active:scale-95 transition-all duration-300"
          >
            BATAL
          </button>
        </div>
      </form>
    </div>

    <style>
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes scale-in {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes slide-up {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fade-in 1s ease-out forwards;
      }
      .animate-scale-in {
        animation: scale-in 1s ease-out forwards;
      }
      .animate-slide-up {
        animation: slide-up 1s ease-out forwards;
      }
    </style>
  </body>
</html>
